# The node lab: a NexusInfra control plane (published community images) and two fresh "hosts" for Install-NexusNode.
# Started and filled by Start-NodeLab.ps1, which also writes .keys/.env (secrets) and the lab inventory and config.
#
# Fixed addresses on one network, because the agent runs in a container *inside* a host container: Docker's names
# (rabbitmq, orchestrator) do not resolve there, addresses do.
#   172.29.50.10 rabbitmq       the broker the agents connect to (Broker.Host in the lab config)
#   172.29.50.11 orchestrator   reaches the agents at http://172.29.50.2x:9100 (AGENT_URL)
#   172.29.50.21 node1          ssh on 127.0.0.1:2231
#   172.29.50.22 node2          ssh on 127.0.0.1:2232
#   172.29.50.30 registry       only for Start-NodeLab.ps1 -BuildFrom: the agent image built on this machine, which
#                               the hosts pull (127.0.0.1:29500 to push it; plain HTTP, allowed in node/daemon.json)
#   172.29.50.23 node3          ssh on 127.0.0.1:2233; the outbound host (reach "outbound", docs/agent-link.md): its
#                               agent publishes no port, so the orchestrator cannot call it and must use the agent
#                               link it opens to the gateway (ws://172.29.50.12:9400/agent-link)
# Only the gateway (127.0.0.1:29400), the registry (127.0.0.1:29500) and the three ssh ports are published, and only on this machine.
name: nexusfleet-node-lab

x-nexusinfra-env: &nexusinfra-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@172.29.50.10:5672

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks: { lab: { ipv4_address: 172.29.50.10 } }

  control-room:
    image: ghcr.io/tombomeke-studios/nexusinfra/control-room:${NEXUSINFRA_VERSION}
    environment: *nexusinfra-env
    depends_on: [rabbitmq]
    networks: { lab: { ipv4_address: 172.29.50.13 } }

  orchestrator:
    image: ghcr.io/tombomeke-studios/nexusinfra/orchestrator:${NEXUSINFRA_VERSION}
    environment:
      <<: *nexusinfra-env
      DATABASE_URL: file:/data/orchestrator.db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      ADMIN_EMAIL: admin@lab.local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONTROL_ROOM_URL: http://172.29.50.13:9000
      NODE_AGENT_URL: http://172.29.50.21:9100
    depends_on: [rabbitmq]
    networks: { lab: { ipv4_address: 172.29.50.11 } }

  gateway:
    image: ghcr.io/tombomeke-studios/nexusinfra/gateway:${NEXUSINFRA_VERSION}
    ports: ['127.0.0.1:29400:9400']
    environment:
      <<: *nexusinfra-env
      ORCHESTRATOR_URL: http://172.29.50.11:9200
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [orchestrator]
    networks: { lab: { ipv4_address: 172.29.50.12 } }

  registry:
    image: registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
    ports: ['127.0.0.1:29500:5000']
    networks: { lab: { ipv4_address: 172.29.50.30 } }

  node1: &node
    build: { context: ./node, args: { PUBKEY: '${LAB_PUBKEY}' } }
    image: nexusfleet-node-lab-host:latest
    hostname: node1
    # Privileged so the Docker daemon that Install-NexusNode installs can run in here; its data in a volume
    # (overlay on overlay does not work).
    privileged: true
    volumes: ['node1-docker:/var/lib/docker']
    ports: ['127.0.0.1:2231:22']
    networks: { lab: { ipv4_address: 172.29.50.21 } }

  node2:
    <<: *node
    hostname: node2
    volumes: ['node2-docker:/var/lib/docker']
    ports: ['127.0.0.1:2232:22']
    networks: { lab: { ipv4_address: 172.29.50.22 } }

  node3:
    <<: *node
    hostname: node3
    volumes: ['node3-docker:/var/lib/docker']
    ports: ['127.0.0.1:2233:22']
    networks: { lab: { ipv4_address: 172.29.50.23 } }

volumes:
  node1-docker:
  node2-docker:
  node3-docker:

networks:
  lab:
    ipam:
      config: [{ subnet: 172.29.50.0/24 }]

# Secrets never go into the repository (CLAUDE.md, section 8). This workflow checks it: gitleaks reads the commits
# and looks for anything shaped like a token, a key or a password. On a pull request it reads only that pull
# request's commits; on dev and main, and every week, the whole history. A finding fails the job, and it goes to
# GitHub code scanning (the Security tab), with the secret itself redacted.
#
# gitleaks runs as its released binary, at a fixed version, and the download is checked against the checksum file
# of that release before it runs.

name: Secrets

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the last: a secret added and removed again is still in the history.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ "$EVENT" = pull_request ]; then range=(--log-opts="$BASE_SHA..$HEAD_SHA"); fi
          "$RUNNER_TEMP/gitleaks" git . "${range[@]}" --config .gitleaks.toml --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload the findings to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

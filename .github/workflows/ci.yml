# CI: lint, unit tests and the build on every pull request and every push to dev and main.
#
#   lint       PSScriptAnalyzer with the repo settings (tools/Invoke-NexusLint.ps1); its findings also go to GitHub
#              code scanning (the Security tab) as SARIF
#   workflows  actionlint on the workflow files, so a typo in a workflow fails here and not at its next run
#   commits    (pull requests) the title and every commit message against the commit rules (CLAUDE.md, section 3)
#   test       the Pester unit tests on Linux, Windows and macOS (tools/Invoke-NexusTests.ps1); fails when the
#              coverage of src/ drops below 95 %
#   build      the shipped module (tools/Build-NexusModule.ps1), so a broken build shows before a release
#
# A feature branch is checked by its pull request, not by every push as well: that ran everything twice. A newer
# push to the same pull request cancels the run it makes outdated. Run it by hand for a branch without a pull request.
#
# Every job writes what it found to the run's summary page: the totals, every failed test with its reason and
# file:line, the results per test file, the slowest tests and the coverage per source file. Each failure is also
# an annotation, so it shows on its line in the pull request. The raw results (NUnit XML, JaCoCo coverage and the
# Markdown report) are kept as artifacts.
#
# Lint and tests are separate jobs, so PSScriptAnalyzer can never load a Pester assembly that blocks Pester 5
# (CLAUDE.md, section 4). The scripts are the same ones you run locally.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# One run per branch or pull request at a time. Only a pull request's outdated run is cancelled: every push to dev
# and main keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To upload the findings to code scanning.
      security-events: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        run: ./tools/Install-NexusTooling.ps1 -Name PSScriptAnalyzer

      # Fails on any finding; each finding becomes an annotation and a row in the summary. Only PSScriptAnalyzer's
      # own internal errors are retried (see the script's help).
      - name: Run PSScriptAnalyzer
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          ./tools/Invoke-NexusLint.ps1 -GitHubAnnotations -SummaryPath $env:GITHUB_STEP_SUMMARY -SarifPath ./psscriptanalyzer.sarif
          Write-Output 'PSScriptAnalyzer: no findings.'

      # Also when there are findings (that is when they matter), and also with none: an empty list closes old alerts.
      - name: Upload the findings to code scanning
        if: always() && hashFiles('psscriptanalyzer.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: psscriptanalyzer.sarif
          category: psscriptanalyzer

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint checks the syntax of every workflow, the expressions, the job and step references, and the
      # inputs of known actions. Run from its published image, at a fixed version.
      - name: Run actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the commits between the base and the head of the pull request are there.
          fetch-depth: 0

      # The title comes in through an environment variable, never pasted into the script: a title is text anyone
      # opening a pull request chooses, and pasted into the script it could run as code.
      - name: Check the title and the commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $title = ./tools/Test-NexusCommitMessage.ps1 -Message $env:PR_TITLE
          $commits = ./tools/Test-NexusCommitMessage.ps1 -Range "$env:BASE_SHA..$env:HEAD_SHA"
          $summary = @('## Commit messages', '', '| | Message | Problem |', '|---|---|---|')
          foreach ($check in @($title) + @($commits)) {
              $mark = if ($check.Valid) { ':white_check_mark:' } else { ':x:' }
              $summary += "| $mark | ``$($check.Message.Replace('|', '\|'))`` | $($check.Reason) |"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")
          $wrong = @(@($title) + @($commits) | Where-Object { -not $_.Valid })
          foreach ($check in $wrong) {
              Write-Output "::error title=Commit message::'$($check.Message)': $($check.Reason). Rules: CLAUDE.md, section 3."
          }
          if ($wrong) { exit 1 }

  test:
    name: Pester (${{ matrix.os }})
    strategy:
      # Every system always finishes, so one failing system never hides the result of another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PSScriptAnalyzer and SecretManagement are only mocked here (tests/tools, tests/utils), but Pester can only
      # mock a command that exists.
      - name: Install Pester 5, PSScriptAnalyzer and SecretManagement
        run: ./tools/Install-NexusTooling.ps1

      - name: Run the unit tests
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          ./tools/Invoke-NexusTests.ps1 -Suite Unit -CI -MinimumCoverage 95 | Out-Null

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

  build:
    name: Build the module
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Copies only the module files to out/, checks in a fresh pwsh that the result loads and exports the manifest's
      # list, and zips it: the same script the release uses.
      - name: Build
        run: ./tools/Build-NexusModule.ps1 | Format-List

      - name: Keep the module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexusfleet-module
          path: out/*.zip
          if-no-files-found: error

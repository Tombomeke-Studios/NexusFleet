# Runs PSScriptAnalyzer and the Pester unit tests on every push and pull request, and keeps the test results
# and the code coverage as an artifact.
# Lint and tests are separate jobs: each runs in its own process, so PSScriptAnalyzer
# can never load a Pester assembly that blocks Pester 5 (see CLAUDE.md, section 4).

name: CI

on:
  push:
  pull_request:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      # The same script you run locally. It fails on any finding, writes each finding as an
      # annotation, and retries only PSScriptAnalyzer's own internal errors (see the script's help).
      - name: Run PSScriptAnalyzer
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          ./tools/Invoke-NexusLint.ps1 -GitHubAnnotations
          Write-Output 'PSScriptAnalyzer: no findings.'

  test:
    name: Pester
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # PSScriptAnalyzer and SecretManagement are only mocked here (tests/tools, tests/utils), but Pester can
      # only mock a command that exists.
      - name: Install Pester 5, PSScriptAnalyzer and SecretManagement
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Microsoft.PowerShell.SecretManagement -RequiredVersion 1.1.2 -Scope CurrentUser -Force

      # Test results (NUnit XML) and code coverage of src/ (JaCoCo) are kept as an artifact, and the totals go
      # into the job summary. The profiler-based coverage (no breakpoints) keeps the run fast.
      - name: Run Pester (without Integration tests)
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          Import-Module Pester -RequiredVersion 5.7.1
          New-Item -Path ./TestResults -ItemType Directory -Force | Out-Null
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Filter.ExcludeTag = 'Integration'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './TestResults/pester.xml'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './src'
          $config.CodeCoverage.UseBreakpoints = $false
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = './TestResults/coverage.xml'
          $result = Invoke-Pester -Configuration $config

          $summary = @(
              '### Pester'
              ''
              '| Passed | Failed | Skipped | Not run | Coverage of src/ |'
              '|---|---|---|---|---|'
              ('| {0} | {1} | {2} | {3} | {4:n1} % |' -f $result.PassedCount, $result.FailedCount, $result.SkippedCount,
                  $result.NotRunCount, $result.CodeCoverage.CoveragePercent)
          )
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed') {
              throw "Pester: $($result.FailedCount) test(s) failed."
          }

      - name: Keep test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

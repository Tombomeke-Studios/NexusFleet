# CI: lint and unit tests on every pull request and every push to dev and main.
#
#   lint   PSScriptAnalyzer with the repo settings (tools/Invoke-NexusLint.ps1)
#   test   the Pester unit tests on Linux and on Windows (tools/Invoke-NexusTests.ps1), with code coverage
#
# A feature branch is checked by its pull request, not by every push as well: that ran everything twice. A newer
# push to the same pull request cancels the run it makes outdated. Run it by hand for a branch without a pull request.
#
# Every job writes what it found to the run's summary page: the totals, every failed test with its reason and
# file:line, the results per test file, the slowest tests and the coverage per source file. Each failure is also
# an annotation, so it shows on its line in the pull request. The raw results (NUnit XML, JaCoCo coverage and the
# Markdown report) are kept as artifacts.
#
# Lint and tests are separate jobs, so PSScriptAnalyzer can never load a Pester assembly that blocks Pester 5
# (CLAUDE.md, section 4). The scripts are the same ones you run locally.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# One run per branch or pull request at a time. Only a pull request's outdated run is cancelled: every push to dev
# and main keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        run: ./tools/Install-NexusTooling.ps1 -Name PSScriptAnalyzer

      # Fails on any finding; each finding becomes an annotation and a row in the summary. Only PSScriptAnalyzer's
      # own internal errors are retried (see the script's help).
      - name: Run PSScriptAnalyzer
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          ./tools/Invoke-NexusLint.ps1 -GitHubAnnotations -SummaryPath $env:GITHUB_STEP_SUMMARY
          Write-Output 'PSScriptAnalyzer: no findings.'

  test:
    name: Pester (${{ matrix.os }})
    strategy:
      # Both systems always finish, so one failing system never hides the result of the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # PSScriptAnalyzer and SecretManagement are only mocked here (tests/tools, tests/utils), but Pester can only
      # mock a command that exists.
      - name: Install Pester 5, PSScriptAnalyzer and SecretManagement
        run: ./tools/Install-NexusTooling.ps1

      - name: Run the unit tests
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          ./tools/Invoke-NexusTests.ps1 -Suite Unit -CI | Out-Null

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore


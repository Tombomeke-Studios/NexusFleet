# Integration: the real thing, end to end, on a GitHub runner with Docker.
#
# Starts the two labs (lab/README.md):
#   E1 lab    an Ubuntu host with sshd and a sudo user          (transport, preflight)
#   node lab  a NexusInfra control plane (each one of lab/control-planes.json: published images, or a branch
#             built from source) and three fresh Ubuntu hosts
#             in which Install-NexusNode installs Docker and the agent (install, status); the third is an
#             outbound host (docs/agent-link.md), refused with a clear reason by a control plane without the link
# and runs every test tagged Integration: among them the three "Klaar als" criteria of the MVP (one command
# turns the hosts into healthy nodes, a second run changes nothing, a failing host does not stop the others).
#
# The report (every failed test with its reason and file:line) goes into the run's summary, like the unit tests.
# NexusFleet's own run logs (logs/<RunId>/) and the lab containers' logs are kept as an artifact, so a failure
# can be followed step by step. A skipped integration test fails the job here: in CI the labs are started first,
# so a skip means a lab did not come up.
#
# The demo jobs start a fresh node lab of their own and run lab/demo/Invoke-NexusLabDemo.ps1: the whole flow
# (preflight, plan, install, second run, status) on every lab host plus one host that cannot work. They put the
# demo's summary (times per phase, the three criteria) in the run's summary, and fail when a criterion does not hold.
# So every pull request shows the MVP's "Klaar als" in a table, next to the tests that check it in detail.
#
# Takes a few minutes (images, apt inside the hosts), so it runs on pull requests and pushes to dev and main, and
# by hand; not on every push to a feature branch. Every night it also runs on dev, so a change on NexusInfra's dev
# that breaks NexusFleet shows the next morning, not at the next NexusFleet pull request.

name: Integration

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it makes outdated; pushes to dev and main always finish.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The control planes every lab job runs against, from one file: adding a NexusInfra version to test is one entry
  # in lab/control-planes.json, and every job below gets it.
  control-planes:
    name: Control planes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Read lab/control-planes.json
        id: read
        run: |
          $planes = Get-Content -Path ./lab/control-planes.json -Raw | ConvertFrom-Json
          $planes | Format-Table -AutoSize | Out-String | Write-Output
          "matrix=$(@{ include = @($planes) } | ConvertTo-Json -Depth 3 -Compress)" | Add-Content -Path $env:GITHUB_OUTPUT

  integration:
    name: Integration (${{ matrix.name }})
    needs: control-planes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same tests run against every control plane; the outbound test picks its part from what the control plane
    # supports, so against one with the agent link it installs node3 over the link.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.control-planes.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 5 and SecretManagement
        run: ./tools/Install-NexusTooling.ps1 -Name Pester, SecretManagement

      - name: Start the E1 lab
        run: ./lab/E1-transport/Start-LabTarget.ps1 -PlainOnly | Format-Table -AutoSize

      - uses: ./.github/actions/start-node-lab
        with:
          version: ${{ matrix.version }}
          nexusinfra-ref: ${{ matrix.nexusinfra-ref }}

      - name: Run the integration tests
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          ./tools/Invoke-NexusTests.ps1 -Suite Integration -CI | Out-Null

      - uses: ./.github/actions/collect-lab-logs
        if: always()
        with:
          artifact: integration-${{ matrix.id }}

      - name: Remove the labs
        if: always()
        run: |
          ./lab/node-lab/Start-NodeLab.ps1 -Remove
          ./lab/E1-transport/Start-LabTarget.ps1 -Remove

  demo:
    name: Demo (${{ matrix.name }})
    needs: control-planes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.control-planes.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-node-lab
        with:
          version: ${{ matrix.version }}
          nexusinfra-ref: ${{ matrix.nexusinfra-ref }}

      # Without the agent link the outbound host is left out; with it, it is installed over the link.
      - name: Run the demo
        run: |
          $demo = ./lab/demo/Invoke-NexusLabDemo.ps1 -OutputPath ./TestResults/demo
          Get-Content -Path (Join-Path -Path $demo.Folder -ChildPath 'summary.md') | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $notHolding = @($demo.Criteria | Where-Object { $_.Holds -ne $true })
          foreach ($criterion in $notHolding) {
              Write-Output "::error::Klaar als does not hold: $($criterion.Criterion). $($criterion.Detail)"
          }
          if ($notHolding) { exit 1 }

      - uses: ./.github/actions/collect-lab-logs
        if: always()
        with:
          artifact: demo-${{ matrix.id }}

      - name: Remove the lab
        if: always()
        run: ./lab/node-lab/Start-NodeLab.ps1 -Remove

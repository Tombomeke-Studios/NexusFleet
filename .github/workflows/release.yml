# Builds the module and publishes it as a GitHub release when a version tag (v1.0.0, ...) is pushed.
# Tags go on main only, at a milestone (CLAUDE.md, section 2). Publishing to the PowerShell Gallery is a later extra.
# Run by hand (workflow_dispatch) it only builds and keeps the zip as an artifact: a dry run of a release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most what the caller gives it: the lint job uploads its findings to code scanning.
    permissions:
      contents: read
      security-events: write

  release:
    name: Build and release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance: a signed statement, through GitHub's OIDC token, of which workflow and commit
      # built the zip.
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag and the manifest must agree, so a release can never ship another version than its name says.
      - name: Check the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Import-PowerShellDataFile -Path ./NexusFleet.psd1).ModuleVersion
          if ($env:TAG -ne "v$version") {
              throw "Tag $env:TAG does not match ModuleVersion $version in NexusFleet.psd1."
          }

      - name: Build the module
        id: build
        run: |
          $build = ./tools/Build-NexusModule.ps1
          $build | Format-List
          "zip=$($build.Zip)" | Add-Content -Path $env:GITHUB_OUTPUT

      # A checksum anyone can compare after downloading: Get-FileHash NexusFleet-<version>.zip
      - name: Write the checksum
        id: checksum
        env:
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          $hash = (Get-FileHash -Path $env:ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = Join-Path -Path (Split-Path -Path $env:ZIP -Parent) -ChildPath 'SHA256SUMS'
          Set-Content -Path $sums -Value "$hash  $(Split-Path -Path $env:ZIP -Leaf)" -NoNewline
          Get-Content -Path $sums
          "sums=$sums" | Add-Content -Path $env:GITHUB_OUTPUT

      # Proof of where the zip comes from: this repository, this workflow, this commit. Check it after downloading
      # with: gh attestation verify NexusFleet-<version>.zip --repo Tombomeke-Studios/NexusFleet
      - name: Attest the build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.zip }}

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.checksum.outputs.sums }}

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          SUMS: ${{ steps.checksum.outputs.sums }}
          TAG: ${{ github.ref_name }}
        # --generate-notes groups the merged pull requests by their type:* label (.github/release.yml).
        run: gh release create $env:TAG $env:ZIP $env:SUMS --title "NexusFleet $env:TAG" --generate-notes --verify-tag

# Dependabot keeps the pinned GitHub Actions (actions/checkout, actions/upload-artifact, ...) up to date: once a week
# it opens a pull request into dev for every action with a newer version, with the new commit SHA and its version in
# the comment. It reads the workflows and our own composite actions. CI checks it like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    target-branch: dev
    labels: ['type:ci']
    commit-message:
      prefix: 'ci(ci)'

  # The base images of the lab hosts and the lab's own services, pinned to a digest: Dependabot proposes the new
  # digest when the image changes (security fixes in Ubuntu, RabbitMQ, the registry).
  - package-ecosystem: docker
    directories: ['/lab/E1-transport/target', '/lab/node-lab/node']
    schedule:
      interval: weekly
    target-branch: dev
    labels: ['type:lab']
    commit-message:
      prefix: 'chore(lab)'

  - package-ecosystem: docker-compose
    directory: /lab/node-lab
    schedule:
      interval: weekly
    target-branch: dev
    labels: ['type:lab']
    commit-message:
      prefix: 'chore(lab)'
